<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect y="380" width="800" height="120" fill="#374151"/>
  <rect y="400" width="800" height="14" fill="#fbbf24"/>
  <!-- truck body -->
  <path d="M60 380 L60 210 Q60 170 110 170 L500 170 Q540 170 560 200 L600 240 Q630 250 630 290 L630 380 Z" fill="#ffffff" stroke="#9f1239" stroke-width="6"/>
  <rect x="90" y="185" width="120" height="120" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="4"/>
  <rect x="230" y="185" width="150" height="120" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="4"/>
  <rect x="400" y="185" width="160" height="120" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="4"/>
  <!-- counter / serving window -->
  <rect x="400" y="215" width="140" height="18" fill="#9f1239"/>
  <rect x="410" y="245" width="40" height="40" rx="4" fill="#fbbf24"/>
  <rect x="460" y="245" width="40" height="40" rx="4" fill="#fbbf24"/>
  <!-- wheels -->
  <circle cx="210" cy="380" r="36" fill="#111827"/>
  <circle cx="210" cy="380" r="17" fill="#9ca3af"/>
  <circle cx="500" cy="380" r="36" fill="#111827"/>
  <circle cx="500" cy="380" r="17" fill="#9ca3af"/>
  <!-- roof sign -->
  <rect x="240" y="120" width="220" height="44" rx="8" fill="#9f1239"/>
  <text x="350" y="150" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">FOOD TRUCK</text>
  <!-- solar panel -->
  <rect x="120" y="128" width="100" height="14" rx="3" fill="#0f172a"/>
  <line x1="170" y1="128" x2="170" y2="142" stroke="#facc15" stroke-width="2"/>
  <text x="400" y="470" font-family="Arial" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">EcoPower ID</text>
</svg>
